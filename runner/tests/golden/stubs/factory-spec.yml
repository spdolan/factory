# Generated by `factory install`; edit .github/factory/config.yml, not this file.
# factory-stub: spec v0.2 12830bad8f4a
name: "Factory: spec"
on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Issue number"
        required: true
        type: number
      dry_run:
        description: "Run the plan and agent jobs, but write nothing"
        type: boolean
        default: false
concurrency:
  group: factory-spec-${{ inputs.issue_number || github.event.issue.number }}
  cancel-in-progress: false
jobs:
  spec:
    if: >-
      (github.event_name != 'issues' || contains(fromJSON('["ready-to-spec", "factory:approved", "factory:local"]'), github.event.label.name))
    uses: acme/factory/.github/workflows/stage.yml@v0.2
    with:
      stage: spec
      params: ${{ toJSON(inputs) }}
      dry_run: ${{ inputs.dry_run == true }}
    permissions:
      contents: write
      issues: write
      pull-requests: write
      packages: read
      id-token: write
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      FACTORY_GITHUB_TOKEN: ${{ secrets.FACTORY_GITHUB_TOKEN }}
      FACTORY_READ_TOKEN: ${{ secrets.FACTORY_READ_TOKEN }}
      FACTORY_SKILLS_TOKEN: ${{ secrets.FACTORY_SKILLS_TOKEN }}
      FACTORY_ARCHIVE_KEY: ${{ secrets.FACTORY_ARCHIVE_KEY }}
