# Generated by `factory install`; edit .github/factory/config.yml, not this file.
# factory-stub: triage v0.2 20438b114490
name: "Factory: triage"
on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Issue number"
        required: true
        type: number
      dry_run:
        description: "Run the plan and agent jobs, but write nothing"
        type: boolean
        default: false
concurrency:
  group: factory-triage-${{ inputs.issue_number || github.event.issue.number }}
  cancel-in-progress: true
jobs:
  triage:
    if: >-
      (github.event_name != 'issues' || vars.FACTORY_TRIAGE_ALL == 'true' || contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.issue.author_association))
    uses: acme/factory/.github/workflows/stage.yml@v0.2
    with:
      stage: triage
      params: ${{ toJSON(inputs) }}
      dry_run: ${{ inputs.dry_run == true }}
    permissions:
      contents: read
      issues: write
      pull-requests: read
      packages: read
      actions: write
      id-token: write
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      FACTORY_GITHUB_TOKEN: ${{ secrets.FACTORY_GITHUB_TOKEN }}
      FACTORY_READ_TOKEN: ${{ secrets.FACTORY_READ_TOKEN }}
      FACTORY_SKILLS_TOKEN: ${{ secrets.FACTORY_SKILLS_TOKEN }}
