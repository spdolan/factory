# Generated by `factory install`; edit .github/factory/config.yml, not this file.
# factory-stub: review v0.2 f948c1dd8f4f
name: "Factory: review"
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull request number"
        required: true
        type: number
      dry_run:
        description: "Run the plan and agent jobs, but write nothing"
        type: boolean
        default: false
concurrency:
  group: factory-review-${{ inputs.pr_number || github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  review:
    uses: acme/factory/.github/workflows/stage.yml@v0.2
    with:
      stage: review
      params: ${{ toJSON(inputs) }}
      dry_run: ${{ inputs.dry_run == true }}
    permissions:
      contents: read
      issues: write
      pull-requests: write
      packages: read
      id-token: write
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      FACTORY_GITHUB_TOKEN: ${{ secrets.FACTORY_GITHUB_TOKEN }}
      FACTORY_READ_TOKEN: ${{ secrets.FACTORY_READ_TOKEN }}
