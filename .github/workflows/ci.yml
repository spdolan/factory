name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # A docker:// step passes args without shell expansion, so run the binary from the shell.
      - name: Lint workflow templates
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7
          ./actionlint -color templates/github/workflows/*.yml .github/workflows/*.yml

      - name: Lint scripts
        run: shellcheck scripts/*.sh scripts/factory templates/repo/materialize.sh templates/repo/sync-skills.sh stages/*/pre.sh

      # The factory names no other repository. FACTORY_PRIVATE_NAMES (optional secret)
      # lists bare names to look for without writing them into this public repository.
      - name: No references to other repositories
        env:
          FACTORY_PRIVATE_NAMES: ${{ secrets.FACTORY_PRIVATE_NAMES }}
        run: scripts/check-references.sh

      - name: Install PyYAML if missing
        run: python3 -c 'import yaml' || python3 -m pip install --quiet --user --break-system-packages pyyaml

      - name: Runner tests
        run: python3 -m unittest discover -s runner/tests

      # actionlint doesn't read composite actions; a YAML error there only shows up when a run loads it.
      - name: Parse composite actions
        run: |
          python3 - <<'PY'
          import glob, yaml
          for path in glob.glob(".github/actions/*/action.yml"):
              action = yaml.safe_load(open(path))
              assert action["runs"]["using"] == "composite", path
              print("ok", path)
          PY

      - name: Compile skill scripts
        run: python3 -m py_compile skills/*/scripts/*.py

      - name: Check skill frontmatter
        run: |
          set -euo pipefail
          for f in skills/*/SKILL.md; do
            name="$(basename "$(dirname "$f")")"
            head -1 "$f" | grep -qx -- '---' || { echo "$f: no frontmatter"; exit 1; }
            grep -qx "name: $name" "$f" || { echo "$f: name must be $name"; exit 1; }
            grep -q '^description: ' "$f" || { echo "$f: no description"; exit 1; }
          done

      - name: CLI smoke test
        run: |
          set -euo pipefail
          scripts/factory --help | grep -q 'factory doctor'
          if scripts/factory nonsense 2>/dev/null; then echo "unknown command should fail"; exit 1; fi

      - name: Installer smoke test
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          git -C "$tmp" init -q
          (cd "$tmp" && "$GITHUB_WORKSPACE/scripts/install-factory.sh")
          test -f "$tmp/.claude/skills/triage/SKILL.md"
          test -f "$tmp/.github/workflows/factory-triage.yml"
          test -f "$tmp/FACTORY.md"
          echo "local edit" >> "$tmp/.claude/skills/review-pr/SKILL.md"
          # Save the output first: grep -q exits early, and the installer's next write would fail with SIGPIPE.
          (cd "$tmp" && "$GITHUB_WORKSPACE/scripts/install-factory.sh") > reinstall.log
          grep -q 'keep    .claude/skills/review-pr/SKILL.md' reinstall.log
          grep -q 'local edit' "$tmp/.claude/skills/review-pr/SKILL.md"

      # Install into a throwaway repository. The stubs' owner comes from this checkout's
      # origin remote, not from the repository they are installed in.
      - name: Install smoke test
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          git -C "$tmp" init -q
          git -C "$tmp" remote add origin https://github.com/example/app.git
          factory="$GITHUB_WORKSPACE/scripts/factory"
          (cd "$tmp" && "$factory" install --ref main) > install.log
          ls "$tmp"/.github/workflows/factory-*.yml
          for f in "$tmp"/.github/workflows/factory-*.yml; do
            grep -q 'stage.yml@main' "$f" || { echo "$f: not calling stage.yml@main"; exit 1; }
          done
          "$GITHUB_WORKSPACE/actionlint" "$tmp"/.github/workflows/factory-*.yml
          grep -qx '# >>> factory' "$tmp/.gitignore"
          grep -qx '.factory/' "$tmp/.gitignore"
          grep -q 'materialize.sh' "$tmp/.claude/settings.json"
          test -x "$tmp/.github/factory/materialize.sh"
          test -f "$tmp/.github/factory/config.yml"
          python3 runner/plan.py validate-config "$tmp/.github/factory/config.yml"
          python3 runner/plan.py check-stubs "$tmp/.github/workflows"
          before="$(cd "$tmp" && find . -path ./.git -prune -o -type f -print0 | sort -z | xargs -0 shasum)"
          (cd "$tmp" && "$factory" install --ref main) > install2.log
          grep -qx 'Nothing changed.' install2.log
          after="$(cd "$tmp" && find . -path ./.git -prune -o -type f -print0 | sort -z | xargs -0 shasum)"
          [ "$before" = "$after" ] || { echo "second install changed files"; exit 1; }
          (cd "$tmp" && "$factory" update) | grep -qx 'Nothing changed.'
          # Skill sources: pin one of this factory's own skills as another source (a skills/ layout),
          # so the test names no other repository. The CLI installs this checkout's sync-skills.sh.
          (cd "$tmp" && "$factory" skills add "$GITHUB_REPOSITORY" main triage) > skills.log
          test -x "$tmp/.agents/sync-skills.sh"
          grep -Eq "^$GITHUB_REPOSITORY +main +[0-9a-f]{40} +triage$" "$tmp/.agents/skills.lock"
          test -f "$tmp/.claude/skills/triage/SKILL.md"
          head -1 "$tmp/.claude/skills/triage/.gitignore" | grep -q '^# agent-skills: synced'
          # Synced folders carry their own .gitignore (install's .claude/settings.json is untracked here, so check the skills only).
          git -C "$tmp" check-ignore -q .claude/skills/triage/SKILL.md || { echo "synced skills aren't ignored"; exit 1; }
          [ -z "$(git -C "$tmp" status --porcelain --untracked-files=all -- .claude/skills)" ] || { echo "synced skills show in git status"; exit 1; }
          # update keeps the repository's copy of sync-skills.sh at this version's.
          echo "# local drift" >> "$tmp/.agents/sync-skills.sh"
          (cd "$tmp" && "$factory" update) > update3.log
          grep -q 'update   .agents/sync-skills.sh' update3.log
          cmp templates/repo/sync-skills.sh "$tmp/.agents/sync-skills.sh"
          # The session hook runs it after copying the factory's skills.
          grep -q '.agents/sync-skills.sh' "$tmp/.github/factory/materialize.sh"
