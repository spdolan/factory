name: Check reusable workflow (temporary)

# Temporary probe for docs/rollout.md's open questions, called from a consuming
# repository. Deleted after the test. Prints no secrets.

on:
  workflow_call:

permissions: {}

jobs:
  probe:
    name: Probe
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write # read this workflow's own commit from the OIDC token
    steps:
      - name: What the called workflow sees
        env:
          REPOSITORY: ${{ github.repository }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          VAR_VERIFY: ${{ vars.FACTORY_VERIFY }}
          VAR_SOURCES: ${{ vars.FACTORY_LOCAL_SETTING_SOURCES }}
        run: |
          set -euo pipefail
          echo "github.repository:        $REPOSITORY"
          echo "github.workflow_ref:      $WORKFLOW_REF"
          echo "github.workflow_sha:      $WORKFLOW_SHA"
          echo "vars.FACTORY_VERIFY:      ${VAR_VERIFY:-<empty>}"
          echo "vars.FACTORY_LOCAL_SETTING_SOURCES: ${VAR_SOURCES:-<empty>}"
          token="$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=factory-check" | jq -r .value)"
          payload="$(cut -d. -f2 <<<"$token" | tr '_-' '/+')"
          while [ $(( ${#payload} % 4 )) -ne 0 ]; do payload="$payload="; done
          echo "OIDC claims (no token printed):"
          base64 -d <<<"$payload" | jq '{repository, workflow_ref, job_workflow_ref, job_workflow_sha}'

      - name: Can GITHUB_TOKEN check out the factory?
        id: checkout
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: spdolan/factory
          ref: claude/factory-deployment-architecture-0wnqis
          path: .factory
          persist-credentials: false

      - name: Checkout result
        env:
          OUTCOME: ${{ steps.checkout.outcome }}
        run: |
          echo "Checkout of the factory with the caller's GITHUB_TOKEN -> $OUTCOME"
