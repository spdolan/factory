name: "Factory: notify consumers"

# 0.1 copy mode: scripts/install-factory.sh copies this file into a repository. 0.2 replaces it
# with a generated stub that calls .github/workflows/stage.yml (MIGRATION.md); phase 2 deletes it.

# Tells each repository listed under "## Consumers" in FACTORY.md that a new
# version was released. Each consumer's factory-dependency-bump.yml bumps
# automatically, or opens an issue for a human if the release is breaking.
#
# Releases created by release-please with GITHUB_TOKEN don't trigger other
# workflows, so call this from the release-please workflow after publishing:
#
#   notify-consumers:
#     needs: [release-please, publish-ts]
#     if: needs.release-please.outputs.ts_release_created == 'true'
#     uses: ./.github/workflows/factory-notify-consumers.yml
#     with:
#       tag: ${{ needs.release-please.outputs.ts_tag }}
#       package: "@owner/library"
#     secrets: inherit
#
# Needs FACTORY_GITHUB_TOKEN with contents write on every consumer repository
# (repository_dispatch). Breaking = the release notes contain "BREAKING CHANGE",
# which release-please writes for `!` commits and BREAKING CHANGE footers.

on:
  workflow_call:
    inputs:
      tag:
        description: Release tag, e.g. ts-v0.3.0
        required: true
        type: string
      package:
        description: Package name consumers depend on, e.g. @owner/library
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, e.g. ts-v0.3.0
        required: true
        type: string
      package:
        description: Package name consumers depend on, e.g. @owner/library
        required: true
        type: string

jobs:
  notify:
    name: Notify consumers
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Dispatch to consumers
        env:
          GH_TOKEN: ${{ github.token }}
          DISPATCH_TOKEN: ${{ secrets.FACTORY_GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
          PACKAGE: ${{ inputs.package }}
        run: |
          set -euo pipefail
          if [ -z "${DISPATCH_TOKEN:-}" ]; then
            echo "::error::FACTORY_GITHUB_TOKEN is not set; it is needed to dispatch to other repositories." >&2
            exit 1
          fi
          if [ ! -f FACTORY.md ]; then
            echo "::notice::No FACTORY.md, so no consumers to notify."
            exit 0
          fi

          # Repository names listed under "## Consumers", e.g. "- `owner/repo`: uses …".
          # shellcheck disable=SC2016 # backticks are Markdown
          consumers="$(awk '/^## /{on = ($0 ~ /^## Consumers/)} on && /^- /' FACTORY.md |
            sed -E 's/^- `?([A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+)`?.*/\1/' |
            grep -E '^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$' | grep -v '^owner/repo$' || true)"
          if [ -z "$consumers" ]; then
            echo "::notice::FACTORY.md lists no consumers."
            exit 0
          fi

          gh release view "$TAG" --repo "$REPO" --json body,url,tagName > release.json
          breaking=false
          jq -r '.body' release.json | grep -q 'BREAKING CHANGE' && breaking=true
          version="${TAG##*-v}"
          sha="$(git rev-list -n 1 "refs/tags/$TAG" 2>/dev/null || gh api "repos/$REPO/commits/$TAG" -q .sha)"
          echo "Release $TAG ($PACKAGE $version) breaking=$breaking"

          payload="$(jq -n \
            --arg source "$REPO" --arg tag "$TAG" --arg version "$version" --arg package "$PACKAGE" \
            --arg sha "$sha" --arg url "$(jq -r .url release.json)" --argjson breaking "$breaking" \
            '{event_type: "factory-dependency-release",
              client_payload: {source_repo: $source, tag: $tag, version: $version, package: $package,
                               commit: $sha, release_url: $url, breaking: $breaking}}')"

          status=0
          for consumer in $consumers; do
            if GH_TOKEN="$DISPATCH_TOKEN" gh api "repos/$consumer/dispatches" --input - <<<"$payload" >/dev/null; then
              echo "Notified $consumer"
            else
              echo "::error::Could not notify $consumer (does FACTORY_GITHUB_TOKEN cover it?)" >&2
              status=1
            fi
          done
          exit "$status"
