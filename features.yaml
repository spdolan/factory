# Every flag the factory has (docs/rollout.md §6.1). It names no repository.
#
# state:
#   preview  off unless a repository opts in (config.yml `features: {preview: all}` or
#            `features: {on: [id]}`)
#   default  on unless a repository opts out (`features: {off: [id]}`, or the
#            FACTORY_FEATURES_OFF variable)
# A flag gates a stage, trigger or autonomy rule in pipeline.yaml (`feature: <id>`), or
# adds skills/<skill>/features/<id>.md to the prompt when it is on.
#
# The plan job lists flags a repository hasn't decided on (in neither features.on nor
# features.off) in the factory:update issue.

spec-auto-advance:
  summary: Agents may start the spec stage for medium ready-to-spec issues without approval (small ones always may).
  stages: [triage]
  state: default
  added: 0.2.0
  cost: one spec run (balanced tier) per medium ready-to-spec issue that triage lets an agent advance

skill-sources:
  summary: Agent jobs also get the skills a repository pins in .agents/skills.lock (other skill repositories), fetched in the plan job so the agent job holds no token for them.
  stages: [triage, spec, implement, review, bet-intake, improve-review, dependency-bump]
  state: preview
  added: 0.2.0
  cost: none; the plan job downloads the pinned sources (a tarball per source) when the lock exists

session-archive:
  summary: Keep each run's redacted transcript and a run record in the private archive repository config.yml names in sessions.archive (docs/memory.md). Does nothing until sessions.archive is set.
  stages: [all]
  state: preview
  added: 0.2.0
  cost: repository storage in the archive; no model calls

# Test only (docs/rollout.md, phase 1 exit): checks that a flag going from preview to default
# reaches the factory:update issue. It gates nothing and is removed before 0.2.1. Don't put it
# in features.on or features.off.
flag-lifecycle-check:
  summary: "Test only: gates nothing. It checks that a flag moving from preview to default shows up in this issue, and will be removed without notice."
  stages: []
  state: default
  added: 0.2.1
  cost: none
